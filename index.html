<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorderFlow — AI Trade & Customs Document Checker</title>
  <script src="https://jsdelivr.net"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #09090B;
      --glass: rgba(12, 12, 15, 0.84);
      --glass-strong: rgba(9, 9, 11, 0.92);
      --border: rgba(255, 255, 255, 0.16);
      --border-strong: rgba(255, 255, 255, 0.35);
      --text: #FAFAFA;
      --muted: #D4D4D8;
      --white: #FFFFFF;
      --black: #09090B;
      --danger: #EF4444;
      --warn: #F59E0B;
      --ok: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 42px; height: 42px; border-radius: 11px; background: var(--white);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-title { font-size: 19px; font-weight: 900; letter-spacing: -0.04em; color: var(--white); line-height: 1; }
    .logo-sub { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
    button { position: relative; z-index: 50; cursor: pointer; transition: 0.15s ease; }
    .btn-white {
      background: var(--white); color: var(--black); border: 1px solid var(--white);
      padding: 11px 20px; border-radius: 8px; font-weight: 800; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .btn-white:hover { background: #E4E4E7; }
    .btn-white:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline {
      background: rgba(18, 18, 21, 0.85); color: var(--white); border: 1px solid var(--border-strong);
      padding: 11px 18px; border-radius: 8px; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .btn-outline:hover { border-color: var(--white); background: rgba(255, 255, 255, 0.08); }
    .bg-video {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      z-index: 0; filter: contrast(110%) brightness(0.55); pointer-events: none;
    }

    /* Landing View */
    #landingView { position: relative; z-index: 10; }
    .top-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 16px 40px;
      background: rgba(9, 9, 11, 0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
    }
    .hero { min-height: 92vh; display: flex; flex-direction: column; justify-content: space-between; }
    .hero-main { max-width: 840px; padding: 80px 40px 40px; }
    .badge-live {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
      background: var(--glass-strong); border: 1px solid var(--white); color: var(--white);
      font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
    }
    .hero-main h1 { font-size: 54px; font-weight: 900; line-height: 1.06; letter-spacing: -0.03em; margin: 20px 0; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0,0,0,0.7); }
    .hero-main p { color: #F4F4F5; font-size: 17px; line-height: 1.6; margin-bottom: 30px; max-width: 620px; }
    .spec-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      background: var(--glass-strong); backdrop-filter: blur(14px); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .spec-box { padding: 22px 32px; border-right: 1px solid var(--border); }
    .spec-num { font-size: 24px; font-weight: 900; color: var(--white); letter-spacing: -0.02em; }
    .spec-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #A1A1AA; text-transform: uppercase; margin-top: 4px; }
    .showcase-banner {
      min-height: 78vh; display: flex; align-items: flex-end; padding: 64px 40px;
      background-size: cover; background-position: center; border-bottom: 1px solid var(--border);
    }
    .showcase-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      border-bottom: 1px solid var(--border); background: #09090B;
    }
    .showcase-tile {
      min-height: 460px; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 40px; background-size: cover; background-position: center;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #FFFFFF; text-transform: uppercase; margin-bottom: 8px; }
    .sec-title { font-size: 34px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; text-transform: uppercase; margin-bottom: 12px; }
    .sec-desc { color: #E4E4E7; font-size: 14px; line-height: 1.6; max-width: 520px; margin-bottom: 20px; }

    /* App Shell (Single Focused Dashboard) */
    .app-shell { display: none; min-height: 100vh; position: relative; z-index: 10; }
    .sidebar {
      width: 260px; background: var(--glass-strong); backdrop-filter: blur(14px);
      border-right: 1px solid var(--border); padding: 18px 14px;
      display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
    }
    .nav-list { display: flex; flex-direction: column; gap: 6px; margin-top: 22px; }
    .nav-btn {
      width: 100%; text-align: left; background: rgba(255,255,255,0.14); border: 1px solid var(--border-strong);
      color: var(--white); padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
    }
    .doc-types-box {
      margin-top: 20px; padding: 14px; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    }
    .doc-types-box h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #A1A1AA; margin-bottom: 10px; }
    .doc-types-box ul { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--muted); }
    .doc-types-box li::before { content: "✓ "; color: var(--white); font-weight: 800; }

    .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      min-height: 64px; background: var(--glass-strong); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border); padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .dash-body { padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .glass-card { background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
    .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .kpi-num { font-size: 32px; font-weight: 900; color: var(--white); margin-top: 6px; }

    /* Dropzone & File Cards */
    .dropzone {
      border: 2px dashed var(--border-strong); border-radius: 12px; padding: 34px 20px;
      text-align: center; background: rgba(255, 255, 255, 0.03); cursor: pointer; transition: 0.2s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--white); background: rgba(255, 255, 255, 0.08); }
    .file-queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
    .file-item {
      background: rgba(9, 9, 11, 0.9); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .file-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .file-name { font-size: 13px; font-weight: 700; color: var(--white); word-break: break-all; }
    .file-meta { font-size: 11px; color: #A1A1AA; }
    .file-select {
      width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: #121215; color: var(--white); font-size: 12px;
    }

    /* Audit Report & Findings */
    .audit-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
    @media (max-width: 1024px) { .audit-grid { grid-template-columns: 1fr; } }
    .finding-card {
      border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px;
      padding: 14px 16px; background: rgba(9, 9, 11, 0.85); margin-bottom: 12px;
    }
    .finding-card.critical { border-left-color: var(--danger); }
    .finding-card.warning { border-left-color: var(--warn); }
    .finding-card.passed { border-left-color: var(--ok); }
    .finding-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .finding-title { font-size: 14px; font-weight: 800; color: var(--white); }
    .pill { padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
    .pill-critical { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.5); }
    .pill-warning { background: rgba(245, 158, 11, 0.2); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.5); }
    .pill-passed { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.5); }
    .finding-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
