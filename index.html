
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BorderFlow | Freight & Customs Management</title>
<meta name="description" content="BorderFlow - AI-powered freight, customs and cross-border operations.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
 --navy:#101d35;--blue:#2864e8;--light:#f4f7fc;
 --white:#fff;--text:#1b2940;--muted:#718096;
 --border:#e4eaf2;--green:#159b69;--red:#d64a4a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--light);font-family:Inter,Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:white;padding:32px;border-radius:16px;width:min(420px,100%);box-shadow:0 12px 40px #14294b12}
.brand{font-size:25px;font-weight:800;color:var(--navy)}
.brand span{color:var(--blue)}
.login-card input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid var(--border);border-radius:8px}
.primary{background:var(--blue);color:white;border:0;padding:11px 17px;border-radius:8px;font-weight:600}
.secondary{background:#edf2ff;color:var(--blue);border:0;padding:10px 14px;border-radius:8px}
.danger{background:#fff0f0;color:var(--red);border:0;padding:9px 12px;border-radius:8px}
#appShell{min-height:100vh}
.sidebar{width:245px;background:var(--navy);color:white;position:fixed;inset:0 auto 0 0;padding:24px 14px;overflow-y:auto;z-index:5}
.sidebar .brand{color:white;padding:0 12px 25px}
.nav-label{font-size:10px;letter-spacing:1.5px;color:#8da1bf;padding:17px 12px 8px}
.nav-btn{display:flex;width:100%;gap:12px;align-items:center;text-align:left;padding:12px;border:0;background:transparent;color:#c7d2e2;border-radius:8px;margin:3px 0}
.nav-btn:hover,.nav-btn.active{background:#253b60;color:white}
.main{margin-left:245px;min-height:100vh}
.topbar{height:72px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}
.content{padding:28px;max-width:1500px;margin:auto}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
h1{font-size:25px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 15px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:19px;margin-bottom:17px}
.metric{font-size:28px;font-weight:800;margin:12px 0 4px}
.metric-label{font-size:13px;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:17px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:650;color:#526078}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:white}
.field textarea{min-height:100px;resize:vertical}
.full{grid-column:1/-1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted);font-weight:600}
.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf2ff;color:var(--blue);font-size:11px}
.status.Cleared{background:#e5f7ef;color:var(--green)}
.status.Rejected{background:#fff0f0;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:12px;border-radius:8px;background:#edf3ff;color:#31558c;font-size:13px;margin:12px 0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:13px 18px;border-radius:9px;z-index:20;display:none;max-width:90vw}
#mobileMenu{display:none}
.agent-card{border:1px solid var(--border);padding:15px;border-radius:10px}
.agent-card strong{display:block;margin-bottom:5px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
 .sidebar{display:none;width:245px}
 .sidebar.open{display:block}
 .main{margin-left:0}
 #mobileMenu{display:inline-block}
 .content{padding:17px}
 .topbar{padding:0 15px}
 .grid{grid-template-columns:1fr 1fr}
 .two-col{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .page-heading{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<div id="loginView">
 <div class="login-card">
  <div class="brand">Border<span>Flow</span></div>
  <p class="muted">Freight, customs and document intelligence.</p>
  <h2 id="authHeading">Welcome back</h2>
  <form id="authForm">
   <div class="field">
    <label>Email address</label>
    <input id="email" type="email" required autocomplete="email">
   </div>
   <div class="field">
    <label>Password</label>
    <input id="password" type="password" required minlength="8" autocomplete="current-password">
   </div>
   <button class="primary" id="authSubmit" style="width:100%">Sign in</button>
  </form>
  <p class="muted" id="authToggle">New to BorderFlow? <a href="#" id="toggleAuth">Create an account</a></p>
  <p class="muted" id="authMessage"></p>
 </div>
</div>

<div id="appShell" class="hidden">
 <aside class="sidebar" id="sidebar">
  <div class="brand">Border<span>Flow</span></div>
  <div class="nav-label">WORKSPACE</div>
  <button class="nav-btn active" data-page="overview">▦ Overview</button>
  <button class="nav-btn" data-page="documents">▤ Document Checker</button>
  <button class="nav-btn" data-page="library">▧ Document Library</button>
  <button class="nav-btn" data-page="shipments">▣ Shipments</button>
  <button class="nav-btn" data-page="tracking">⌖ Live Tracking</button>
  <button class="nav-btn" data-page="customs">⚖ Customs Management</button>
  <button class="nav-btn" data-page="compliance">✓ Compliance</button>
  <button class="nav-btn" data-page="customers">♙ Customers</button>
  <button class="nav-btn" data-page="invoices">▤ Invoices & Payments</button>
  <button class="nav-btn" data-page="finance">▥ Finance</button>
  <button class="nav-btn" data-page="reports">▥ Reports & Analytics</button>
  <div class="nav-label">SYSTEM</div>
  <button class="nav-btn" data-page="agents">✧ AI Agents</button>
  <button class="nav-btn" data-page="settings">⚙ Settings & Admin</button>
  <button class="nav-btn" id="logoutBtn">⇥ Sign out</button>
 </aside>

 <main class="main">
  <header class="topbar">
   <div class="actions">
    <button class="secondary" id="mobileMenu">☰</button>
    <strong id="pageTitle">Overview</strong>
   </div>
   <div class="actions">
    <span class="muted" id="userEmail"></span>
    <span class="status">Connected workspace</span>
   </div>
  </header>
  <section class="content" id="pageContent"></section>
 </main>
</div>
<div id="toast"></div>

<script>
/* 1. CONFIGURATION: replace these two values with your Supabase project details. */
const SUPABASE_URL = "https://ngkmbpbdaachqymnfffe.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";
const BUCKET = "freight-documents";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser = null;
let currentPage = "overview";
let signupMode = false;
let cachedShipments = [];
let cachedCustomers = [];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
function toast(message){
 $("toast").textContent=message;
 $("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",3500);
}
function money(value){
 return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(value||0));
}
function setPage(page){
 currentPage=page;
 $("pageTitle").textContent=page.charAt(0).toUpperCase()+page.slice(1);
 document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 $("sidebar").classList.remove("open");
 renderPage();
}
function shell(show){
 $("loginView").classList.toggle("hidden",show);
 $("appShell").classList.toggle("hidden",!show);
}
async function loadSession(){
 const {data,error}=await db.auth.getSession();
 if(error){toast(error.message);return}
 if(data.session){currentUser=data.session.user;await startApp()}
 else shell(false);
}
async function startApp(){
 if(!currentUser)return;
 $("userEmail").textContent=currentUser.email||"";
 shell(true);
 await setPage("overview");
}
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("authSubmit").disabled=true;
 $("authMessage").textContent="Connecting...";
 const email=$("email").value.trim();
 const password=$("password").value;
 try{
  const result=signupMode
   ?await db.auth.signUp({email,password})
   :await db.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  if(signupMode&&!result.data.session){
   $("authMessage").textContent="Account created. Check your email to confirm your address.";
  }else if(result.data.session){
   currentUser=result.data.user;await startApp();
  }
 }catch(error){$("authMessage").textContent=error.message}
 finally{$("authSubmit").disabled=false}
});
$("toggleAuth").onclick=e=>{
 e.preventDefault();signupMode=!signupMode;
 $("authHeading").textContent=signupMode?"Create your account":"Welcome back";
 $("authSubmit").textContent=signupMode?"Create account":"Sign in";
 $("authToggle").innerHTML=signupMode
 ?"Already registered? <a href='#' id='toggleAuth'>Sign in</a>"
 :"New to BorderFlow? <a href='#' id='toggleAuth'>Create an account</a>";
 $("toggleAuth").onclick=arguments.callee;
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();currentUser=null;shell(false)};
$("mobileMenu").onclick=()=>$("sidebar").classList.toggle("open");
document.querySelectorAll(".nav-btn[data-page]").forEach(button=>{
 button.addEventListener("click",()=>setPage(button.dataset.page));
});
db.auth.onAuthStateChange((_event,session)=>{
 currentUser=session?.user||null;
 if(!session)shell(false);
});

async function rows(table,order="created_at"){
 const {data,error}=await db.from(table).select("*").order(order,{ascending:false}).limit(100);
 if(error)throw error;
 return data||[];
}
async function insertRow(table,record){
 const {data,error}=await db.from(table).insert(record).select().single();
 if(error)throw error;return data;
}
async function updateRow(table,id,record){
 const {data,error}=await db.from(table).update(record).eq("id",id).select().single();
 if(error)throw error;return data;
}
async function removeRow(table,id){
 const {error}=await db.from(table).delete().eq("id",id);
 if(error)throw error;
}
function heading(title,description,button=""){
 return `<div class="page-heading"><div><h1>${title}</h1><div class="muted">${description}</div></div>${button}</div>`;
}
function tableHTML(headers,body){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}">No records yet.</td></tr>`}</tbody></table></div>`;
}
async function renderPage(){
 const root=$("pageContent");
 root.innerHTML='<div class="card">Loading your workspace...</div>';
 try{
  const pages={
   overview:renderOverview,documents:renderDocuments,library:renderLibrary,
   shipments:renderShipments,tracking:renderTracking,customs:renderCustoms,
   compliance:renderCompliance,customers:renderCustomers,invoices:renderInvoices,
   finance:renderFinance,reports:renderReports,agents:renderAgents,settings:renderSettings
  };
  await pages[currentPage]();
 }catch(error){
  root.innerHTML=`<div class="card"><h2>Unable to load this section</h2><p class="muted">${esc(error.message)}</p><button class="secondary" onclick="renderPage()">Retry</button></div>`;
 }
}

async function renderOverview(){
 const [shipments,documents,customers,invoices]=await Promise.all([
  rows("bf_shipments"),rows("bf_documents"),rows("bf_customers"),rows("bf_invoices")
 ]);
 cachedShipments=shipments;cachedCustomers=customers;
 const active=shipments.filter(s=>!["Cleared","Cancelled"].includes(s.status)).length;
 const unpaid=invoices.filter(i=>i.status!=="Paid").reduce((n,i)=>n+Number(i.total||0),0);
 $("pageContent").innerHTML=heading("Overview","Your cross-border operations at a glance")+
 `<div class="grid">
  <div class="card"><div class="metric-label">Total shipments</div><div class="metric">${shipments.length}</div><div class="muted">Saved shipment records</div></div>
  <div class="card"><div class="metric-label">Active shipments</div><div class="metric">${active}</div><div class="muted">Not yet cleared or cancelled</div></div>
  <div class="card"><div class="metric-label">Documents</div><div class="metric">${documents.length}</div><div class="muted">Stored document records</div></div>
  <div class="card"><div class="metric-label">Outstanding invoices</div><div class="metric">${money(unpaid)}</div><div class="muted">${invoices.filter(i=>i.status!=="Paid").length} unpaid invoices</div></div>
 </div>
 <div class="two-col">
  <div class="card"><h2>Recent shipments</h2>${tableHTML(["Reference","Destination","Status"],shipments.slice(0,6).map(s=>`<tr><td>${esc(s.shipment_ref)}</td><td>${esc(s.destination_city)}</td><td><span class="status">${esc(s.status)}</span></td></tr>`).join(""))}</div>
  <div class="card"><h2>Business overview</h2><p>Registered customers: <strong>${customers.length}</strong></p><p>Documents stored: <strong>${documents.length}</strong></p><p>Invoices: <strong>${invoices.length}</strong></p><div class="notice">Statistics are calculated from saved records in your Supabase database.</div></div>
 </div>`;
}

async function renderShipments(){
 const data=await rows("bf_shipments");cachedShipments=data;
 $("pageContent").innerHTML=heading("Shipments","Create and manage freight movements",'<button class="primary" onclick="shipmentForm()">+ New shipment</button>')+
 `<div class="card" id="shipmentFormArea"></div><div class="card"><h2>Shipment records</h2>${tableHTML(["Reference","Truck","Driver","Origin","Destination","Border","Status","Actions"],data.map(s=>`<tr>
 <td>${esc(s.shipment_ref)}</td><td>${esc(s.truck_registration)}</td><td>${esc(s.driver_name)}</td>
 <td>${esc(s.origin_city)}</td><td>${esc(s.destination_city)}</td><td>${esc(s.border_post)}</td>
 <td><span class="status">${esc(s.status)}</span></td>
 <td><button class="secondary" onclick="changeShipmentStatus('${s.id}')">Update</button></td></tr>`).join(""))}</div>`;
}
function shipmentForm(){
 $("shipmentFormArea").innerHTML=`<h2>New shipment</h2><form id="newShipment" class="form-grid">
 ${field("Shipment reference","shipment_ref","BF-001")}
 ${field("Truck registration","truck_registration")}
 ${field("Driver name","driver_name")}
 ${field("Driver phone","driver_phone")}
 ${field("Origin city","origin_city")}
 ${field("Destination city","destination_city")}
 ${field("Border post","border_post")}
 <div class="field"><label>Cargo description</label><textarea name="cargo_description" required></textarea></div>
 <div class="field"><label>Status</label><select name="status"><option>Created</option><option>In Transit</option><option>Arrived at Border</option><option>Docs Checked</option><option>Duty Paid</option><option>Cleared</option></select></div>
 <button class="primary full">Save shipment</button></form>`;
 $("newShipment").onsubmit=async e=>{
  e.preventDefault();const record=Object.fromEntries(new FormData(e.target));
  try{await insertRow("bf_shipments",record);toast("Shipment saved");await renderShipments()}
  catch(err){toast(err.message)}
 };
}
function field(label,name,placeholder="",type="text"){
 return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${esc(placeholder)}" ${name==="shipment_ref"?"required":""}></div>`;
}
async function changeShipmentStatus(id){
 const status=prompt("Enter new status: Created, In Transit, Arrived at Border, Docs Checked, Duty Paid, Cleared or Cancelled");
 if(!status)return;
 const allowed=["Created","In Transit","Arrived at Border","Docs Checked","Duty Paid","Cleared","Cancelled"];
 if(!allowed.includes(status)){toast("Invalid status");return}
 try{await updateRow("bf_shipments",id,{status});toast("Shipment updated");await renderPage()}
 catch(e){toast(e.message)}
}

async function renderCustomers(){
 const data=await rows("bf_customers");cachedCustomers=data;
 $("pageContent").innerHTML=heading("Customers","Manage your business customers",'<button class="primary" onclick="customerForm()">+ Add customer</button>')+
 `<div class="card" id="customerFormArea"></div><div class="card">${tableHTML(["Company","Contact","Email","Phone","Actions"],data.map(c=>`<tr><td>${esc(c.company_name)}</td><td>${esc(c.contact_name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td><button class="danger" onclick="deleteRecord('bf_customers','${c.id}')">Delete</button></td></tr>`).join(""))}</div>`;
}
function customerForm(){
 $("customerFormArea").innerHTML=`<h2>Add customer</h2><form id="newCustomer" class="form-grid">
 ${field("Company name","company_name")}${field("Contact name","contact_name")}
 ${field("Email","email","","email")}${field("Phone","phone")}
 <div class="field full"><label>Address</label><textarea name="address"></textarea></div>
 <button class="primary full">Save customer</button></form>`;
 $("newCustomer").onsubmit=async e=>{
  e.preventDefault();try{await insertRow("bf_customers",Object.fromEntries(new FormData(e.target)));toast("Customer saved");await renderCustomers()}
  catch(err){toast(err.message)}
 };
}
async function deleteRecord(table,id){
 if(!confirm("Delete this record?"))return;
 try{await removeRow(table,id);toast("Record deleted");await renderPage()}
 catch(e){toast(e.message)}
}

async function renderInvoices(){
 const data=await rows("bf_invoices");
 $("pageContent").innerHTML=heading("Invoices & Payments","Create invoices and record payment status",'<button class="primary" onclick="invoiceForm()">+ New invoice</button>')+
 `<div class="card" id="invoiceFormArea"></div><div class="card">${tableHTML(["Invoice","Customer","Amount","Due date","Status","Actions"],data.map(i=>`<tr><td>${esc(i.invoice_number)}</td><td>${esc(i.customer_name)}</td><td>${money(i.total)}</td><td>${esc(i.due_date)}</td><td><span class="status">${esc(i.status)}</span></td><td><button class="secondary" onclick="markPaid('${i.id}')">Mark paid</button></td></tr>`).join(""))}</div>`;
}
function invoiceForm(){
 $("invoiceFormArea").innerHTML=`<h2>Create invoice</h2><form id="newInvoice" class="form-grid">
 ${field("Invoice number","invoice_number","INV-001")}
 ${field("Customer name","customer_name")}
 ${field("Amount USD","total","0","number")}
 ${field("Due date","due_date","","date")}
 <button class="primary full">Save invoice</button></form>`;
 $("newInvoice").onsubmit=async e=>{
  e.preventDefault();const r=Object.fromEntries(new FormData(e.target));r.total=Number(r.total);
  try{await insertRow("bf_invoices",r);toast("Invoice saved");await renderInvoices()}
  catch(err){toast(err.message)}
 };
}
async function markPaid(id){
 try{await updateRow("bf_invoices",id,{status:"Paid"});toast("Invoice marked paid");await renderInvoices()}
 catch(e){toast(e.message)}
}

async function renderDocuments(){
 $("pageContent").innerHTML=heading("AI Document Checker","Upload a trade document, extract its text and ask BorderFlow AI to inspect it.")+
 `<div class="two-col">
 <div class="card"><h2>Upload and check</h2><form id="documentForm">
 <div class="field"><label>Shipment reference</label><input name="shipment_ref" required placeholder="BF-001"></div>
 <div class="field"><label>Document type</label><select name="document_type"><option>Commercial Invoice</option><option>Packing List</option><option>Bill of Lading</option><option>Certificate of Origin</option><option>Customs Declaration</option><option>Other</option></select></div>
 <div class="field"><label>Document file (max 10 MB)</label><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" required></div>
 <button class="primary" style="margin-top:15px">Upload and analyse</button></form>
 <div id="documentProgress" class="notice hidden"></div></div>
 <div class="card"><h2>AI document results</h2><div id="aiResult" class="muted">Your analysis will appear here.</div></div>
 </div>`;
 $("documentForm").onsubmit=processDocument;
}
async function processDocument(e){
 e.preventDefault();
 const form=e.target,file=form.file.files[0];
 if(!file||file.size>10*1024*1024){toast("Choose a file smaller than 10 MB");return}
 const progress=$("documentProgress"),result=$("aiResult");
 progress.classList.remove("hidden");progress.textContent="Uploading document...";
 result.textContent="Waiting for analysis...";
 try{
  const ext=file.name.split(".").pop().toLowerCase();
  const path=`${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
  const upload=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
  if(upload.error)throw upload.error;
  progress.textContent="Extracting text...";
  let extractedText="";
  if(file.type.startsWith("image/")){
   const ocr=await Tesseract.recognize(file,"eng");
   extractedText=ocr.data.text;
  }else if(file.type==="application/pdf"){
   extractedText="[PDF uploaded. OCR extraction for PDF files must be enabled in the backend.]";
  }else{
   extractedText="[Unsupported file type for browser OCR.]";
  }
  const saved=await insertRow("bf_documents",{
   shipment_ref:form.shipment_ref.value.trim(),
   document_type:form.document_type.value,
   file_name:file.name,storage_path:path,
   extracted_text:extractedText,
   status:"Uploaded"
  });
  progress.textContent="Calling BorderFlow AI...";
  const {data,error}=await db.functions.invoke("document-intelligence",{
   body:{action:"check_document",document_id:saved.id,shipment_ref:form.shipment_ref.value.trim(),document_type:form.document_type.value,extracted_text:extractedText}
  });
  if(error)throw error;
  result.innerHTML=`<h3>${esc(data?.result?.overall_status||data?.overall_status||"Analysis complete")}</h3>
   <p>${esc(data?.result?.summary||data?.summary||"Analysis returned.")}</p>
   <pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(data?.result||data,null,2))}</pre>`;
  progress.textContent="Document uploaded and analysed.";
  await renderPage();
 }catch(error){
  progress.textContent="The operation did not finish.";
  result.textContent=error.message;
  toast("Document processing failed: "+error.message);
 }
}

async function renderLibrary(){
 const data=await rows("bf_documents");
 $("pageContent").innerHTML=heading("Document Library","Browse uploaded trade documents")+
 `<div class="card">${tableHTML(["File","Shipment","Type","Status","Uploaded"],data.map(d=>`<tr><td>${esc(d.file_name)}</td><td>${esc(d.shipment_ref)}</td><td>${esc(d.document_type)}</td><td>${esc(d.status)}</td><td>${new Date(d.created_at).toLocaleDateString()}</td></tr>`).join(""))}</div>`;
}
async function renderTracking(){
 const data=await rows("bf_shipments");
 $("pageContent").innerHTML=heading("Live Tracking","Track saved shipment progress")+
 `<div class="notice">Tracking currently displays updates saved by your team. Automatic GPS tracking requires driver-device integration.</div>
 <div class="card">${tableHTML(["Reference","Truck","Origin","Destination","Border","Latest status"],data.map(s=>`<tr><td>${esc(s.shipment_ref)}</td><td>${esc(s.truck_registration)}</td><td>${esc(s.origin_city)}</td><td>${esc(s.destination_city)}</td><td>${esc(s.border_post)}</td><td>${esc(s.status)}</td></tr>`).join(""))}</div>`;
}
async function renderCustoms(){
 const data=await rows("bf_customs");
 $("pageContent").innerHTML=heading("Customs Management","Maintain customs declaration and duty records",'<button class="primary" onclick="customsForm()">+ New record</button>')+
 `<div class="card" id="customsFormArea"></div><div class="card">${tableHTML(["Shipment","Declaration","Duty","Currency","Status"],data.map(x=>`<tr><td>${esc(x.shipment_ref)}</td><td>${esc(x.declaration_number)}</td><td>${esc(x.duty_amount)}</td><td>${esc(x.currency)}</td><td>${esc(x.status)}</td></tr>`).join(""))}</div>`;
}
function customsForm(){
 $("customsFormArea").innerHTML=`<h2>Customs record</h2><form id="customsForm" class="form-grid">
 ${field("Shipment reference","shipment_ref")}${field("Declaration number","declaration_number")}
 ${field("Duty amount","duty_amount","0","number")}
 <div class="field"><label>Currency</label><select name="currency"><option>USD</option><option>ZAR</option><option>EUR</option><option>GBP</option><option>ZWG</option></select></div>
 <div class="field"><label>Status</label><select name="status"><option>Pending</option><option>Submitted</option><option>Approved</option><option>Rejected</option></select></div>
 <button class="primary full">Save customs record</button></form>`;
 $("customsForm").onsubmit=async e=>{
  e.preventDefault();const r=Object.fromEntries(new FormData(e.target));r.duty_amount=Number(r.duty_amount);
  try{await insertRow("bf_customs",r);toast("Customs record saved");await renderCustoms()}
  catch(err){toast(err.message)}
 };
}
async function renderCompliance(){
 const docs=await rows("bf_documents");
 const checks=await rows("bf_document_checks");
 $("pageContent").innerHTML=heading("Compliance","Review document checks and compliance findings")+
 `<div class="card"><h2>Documents requiring attention</h2>${tableHTML(["Document","Shipment","Type","Status"],docs.filter(d=>d.status!=="Approved").map(d=>`<tr><td>${esc(d.file_name)}</td><td>${esc(d.shipment_ref)}</td><td>${esc(d.document_type)}</td><td>${esc(d.status)}</td></tr>`).join(""))}</div>
 <div class="card"><h2>AI check history</h2>${tableHTML(["Document ID","Status","Date"],checks.map(c=>`<tr><td>${esc(c.document_id)}</td><td>${esc(c.overall_status)}</td><td>${new Date(c.created_at).toLocaleString()}</td></tr>`).join(""))}</div>`;
}
async function renderFinance(){
 const invoices=await rows("bf_invoices");
 const paid=invoices.filter(i=>i.status==="Paid").reduce((n,i)=>n+Number(i.total||0),0);
 const due=invoices.filter(i=>i.status!=="Paid").reduce((n,i)=>n+Number(i.total||0),0);
 $("pageContent").innerHTML=heading("Finance","Monitor recorded invoice income and outstanding balances")+
 `<div class="grid"><div class="card"><div class="metric-label">Paid invoices</div><div class="metric">${money(paid)}</div></div><div class="card"><div class="metric-label">Outstanding</div><div class="metric">${money(due)}</div></div><div class="card"><div class="metric-label">Invoice count</div><div class="metric">${invoices.length}</div></div><div class="card"><div class="metric-label">Paid count</div><div class="metric">${invoices.filter(i=>i.status==="Paid").length}</div></div></div>
 <div class="notice">These are recorded invoice totals, not bank balances or verified payments. Payment-provider integration is a separate deployment step.</div>`;
}
async function renderReports(){
 const [s,d,c,i]=await Promise.all([rows("bf_shipments"),rows("bf_documents"),rows("bf_customers"),rows("bf_invoices")]);
 $("pageContent").innerHTML=heading("Reports & Analytics","Operational summary based on your saved records")+
 `<div class="card"><h2>Current workspace report</h2>
 <p>Total shipments: <strong>${s.length}</strong></p><p>Cleared shipments: <strong>${s.filter(x=>x.status==="Cleared").length}</strong></p>
 <p>Documents uploaded: <strong>${d.length}</strong></p><p>Customers: <strong>${c.length}</strong></p><p>Invoices: <strong>${i.length}</strong></p>
 <button class="secondary" onclick="exportShipments()">Export shipments CSV</button></div>`;
}
async function exportShipments(){
 const data=await rows("bf_shipments");
 const cols=["shipment_ref","truck_registration","driver_name","origin_city","destination_city","border_post","status"];
 const csv=[cols.join(","),...data.map(r=>cols.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
 const a=document.createElement("a");a.href=url;a.download="borderflow-shipments.csv";a.click();URL.revokeObjectURL(url);
}

 $("pageContent").innerHTML=heading("BorderFlow AI Agents","AI tools powered by your Groq-backed Supabase Edge Function")+
 `<div class="grid">
 ${[
